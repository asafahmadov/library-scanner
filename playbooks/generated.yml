---
- name: Real change demo (creates a file, no sudo)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Create a marker file
      ansible.builtin.copy:
        dest: /tmp/automansible-demo.txt
        content: |
          Created by automansible automation.
          AI-generated playbook, merged via PR, executed on a runner.
        mode: '0644'

    - name: Read it back
      ansible.builtin.command: cat /tmp/automansible-demo.txt
      register: f
      changed_when: false

    - name: Show contents
      ansible.builtin.debug:
        msg: "{{ f.stdout_lines }}"