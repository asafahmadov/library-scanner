---
- name: Clean demo (no privilege escalation)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Greeting
      ansible.builtin.debug:
        msg: "automansible: AI-generated, merged via PR, executed on a runner."

    - name: Who am I
      ansible.builtin.command: whoami
      register: who
      changed_when: false

    - name: Show runner user
      ansible.builtin.debug:
        msg: "Running as {{ who.stdout }}"

    - name: UTC time
      ansible.builtin.command: date -u
      register: now
      changed_when: false

    - name: Show time
      ansible.builtin.debug:
        msg: "UTC: {{ now.stdout }}"